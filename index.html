<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Siroko Café - Menú</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
    /* --- VARIABLES & RESET --- */
    :root {
        --primary: #8bba8b;
        --dark: #1a1a1a;
        --light: #f4f4f4;
        --white: #ffffff;
        --shadow: 0 4px 15px rgba(0,0,0,0.05);
        --radius: 12px;
        --bg-print: #F2F1E8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--light);
        color: var(--dark);
    }

    h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; font-weight: 600; }

    /* HEADER */
    header {
        background: var(--white);
        padding: 0.8rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .logo-wrapper { display: flex; align-items: center; gap: 10px; }
    .logo-wrapper img { height: 40px; width: auto; object-fit: contain; }
    .logo-wrapper h1 { font-size: 1.2rem; margin: 0; text-transform: uppercase; font-weight: 800; letter-spacing: -0.5px; }
    h1 a { text-decoration: none; color: inherit; }

    .lang-select { display: flex; gap: 5px; }
    .lang-select button {
        background: #eee; border: none; padding: 6px 10px; border-radius: 6px;
        font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    .lang-select button.active { background: var(--dark); color: var(--white); }

    /* BANNER PROMO */
    .promo-banner {
        background-color: var(--light);
        color: var(--primary);
        text-align: center;
        padding: 10px 15px;
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        animation: pulse-banner 3s infinite ease-in-out;
    }
    @keyframes pulse-banner { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; } }

    /* HERO & SEARCH */
    .hero-section { padding: 1.5rem 1.5rem 0.5rem 1.5rem; background: var(--white); }
    #search-bar {
        width: 100%; padding: 12px 15px; background: #f0f0f0; border: none;
        border-radius: 10px; font-size: 1rem; outline: none; font-family: 'Inter', sans-serif;
    }
    #search-bar:focus { background: #fff; box-shadow: 0 0 0 2px var(--primary); }

    /* CATEGORIES - CORREGIDO EL SCROLL BEHAVIOR */
    .categories-wrapper {
        position: sticky; top: 60px; background: rgba(255,255,255,0.95);
        backdrop-filter: blur(5px); z-index: 900; padding: 10px 0;
        border-bottom: 1px solid #eee;
    }
    .categories { 
        display: flex; gap: 8px; overflow-x: auto; padding: 0 1.5rem; 
        scrollbar-width: none; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .categories::-webkit-scrollbar { display: none; }
    .categories button {
        white-space: nowrap; background: transparent; color: #666; border: 1px solid #ddd;
        padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        transition: all 0.2s;
    }
    .categories button.btn-top { border-color: var(--dark); color: var(--dark); font-weight: 800; }
    .categories button.active { background: var(--dark); color: #fff; border-color: var(--dark); }

    /* PRODUCTS CONTAINER */
    #products-container {
        background-color: var(--light);
        padding: 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        min-height: 400px;
    }

    .product-card {
        background: var(--white); border-radius: var(--radius); overflow: hidden;
        box-shadow: var(--shadow); border: 1px solid #eee;
        display: flex; flex-direction: column;
        position: relative;
    }

    /* TARJETA SIN IMAGEN - BORDE VERDE RESTAURADO */
    .product-card.no-image { border-top: 5px solid var(--primary) !important; }

    .card-image-container {
        width: 100%; aspect-ratio: 4/3;
        position: relative; background: #f0f0f0; overflow: hidden;
    }

    .product-card img {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        opacity: 0; transition: opacity 0.5s ease-in;
    }
    .product-card img.loaded { opacity: 1; }
    
    .badge-rec {
        position: absolute; top: 8px; left: 8px; background: #fff; color: #000;
        font-size: 0.6rem; padding: 3px 6px; border-radius: 4px; font-weight: 800;
        text-transform: uppercase; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card-content { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-card h3 { font-size: 1.1rem; margin-bottom: 5px; color: var(--dark); line-height: 1.2; }
    .product-card .description { font-size: 0.9rem; color: #777; margin-bottom: 12px; line-height: 1.4; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid #f9f9f9; }
    .product-card .price { font-size: 1.1rem; font-weight: 800; color: var(--primary); }

    /* ESTILOS PDF / IMPRESIÓN EXCLUSIVOS */
    @media print {
        header, .promo-banner, .hero-section, .categories-wrapper, footer, .print-btn-float, #products-container, #loading-spinner {
            display: none !important;
        }
        body { background-color: var(--bg-print) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        #print-menu-container { display: block !important; padding: 20px; }
        .print-header { text-align: center; margin-bottom: 30px; }
        .print-header img { width: 80px; margin-bottom: 10px; }
        .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; }
        .print-cat-title { grid-column: 1 / -1; font-family: 'Montserrat'; border-bottom: 2px solid #000; margin: 20px 0 10px; text-transform: uppercase; }
        .print-item { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; padding: 4px 0; font-size: 13px; }
    }
    #print-menu-container { display: none; }
    .print-btn-float {
        position: fixed; bottom: 20px; right: 20px; background: var(--dark);
        color: white; border: none; width: 50px; height: 50px; border-radius: 50%;
        cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 9999; font-size: 20px;
    }

    @media (min-width: 900px) {
        header, .hero-section, .categories-wrapper, footer, .promo-banner { padding-left: calc(50% - 475px); padding-right: calc(50% - 475px); }
        #products-container { max-width: 950px; margin: 0 auto; grid-template-columns: repeat(3, 1fr); }
    }
</style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'"> 
        <h1><a href="https://www.sirokocafe.com">Siroko Café</a></h1>
    </div>
    <div class="lang-select">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="ca">CA</button>
        <button data-lang="en">EN</button>
    </div>
</header>

<div id="promo-banner" class="promo-banner">
     <span id="promo-text">10% adicional si se consume en terraza</span>
</div>
    
<div class="hero-section">
    <input type="text" id="search-bar" placeholder="Buscar productos...">
</div>

<div class="categories-wrapper">
    <div class="categories" id="category-buttons"></div>
</div>

<div id="loading-spinner">
    <div class="spinner"></div>
    <p>Cargando menú...</p>
</div>

<div class="products" id="products-container"></div>
<div id="print-menu-container"></div>

<button class="print-btn-float" onclick="prepareAndPrint()">🖨️</button>

<footer>
    <h4>Siroko Café</h4>
    <p>Carrer de Girona 94, Barcelona</p>
    <p style="margin-top:10px">
        <a href="https://instagram.com/siroko.cafe">Instagram</a> • <a href="mailto:info@sirokocafe.com">Email</a>
    </p>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXOjNXQs-0j0eenVgJcv_jkTuKJ7LTVf1C9XlmX4DaplqD52wAPxjTf36c7adNgPqWvg/exec";
const CATEGORY_ORDER = ["promos", "cafes", "bolleria y dulces", "bebidas calientes", "tostas y bocadillos", "bebidas frias", "bar"];
let menuData = {};
let currentLang = "es";
let currentCategory = "TOP";
const currencyFormatter = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

// --- FUNCIONES DE WINDOW (PARA ACCESO GLOBAL) ---

window.handleCategoryChange = function(btnElement, key) {
    currentCategory = key;
    renderCategories();
    renderProducts();
    
    // 1. Centrado Horizontal del botón (usando un pequeño delay para asegurar la clase active)
    if (btnElement) {
        setTimeout(() => {
            btnElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 50);
    }

    // 2. Reset de Scroll vertical (Subir al buscador)
    setTimeout(() => {
        const target = document.getElementById("search-bar");
        if (target) {
            const yOffset = -80;
            const y = target.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({ top: y, behavior: 'smooth' });
        }
    }, 100);
};

window.renderCategories = function() {
    const catContainer = document.getElementById("category-buttons");
    catContainer.innerHTML = "";
    
    const topBtn = document.createElement("button");
    topBtn.textContent = "★ TOP";
    topBtn.className = "btn-top" + (currentCategory === "TOP" ? " active" : "");
    topBtn.onclick = function() { window.handleCategoryChange(this, "TOP"); };
    catContainer.appendChild(topBtn);

    let keys = Object.keys(menuData[currentLang] || {}).sort((a, b) => {
        let nameA = menuData[currentLang][a].name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        let nameB = menuData[currentLang][b].name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        let idxA = CATEGORY_ORDER.findIndex(c => c === nameA);
        let idxB = CATEGORY_ORDER.findIndex(c => c === nameB);
        return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
    });

    keys.forEach(key => {
        const btn = document.createElement("button");
        btn.textContent = menuData[currentLang][key].name;
        if(currentCategory === key) btn.classList.add("active");
        btn.onclick = function() { window.handleCategoryChange(this, key); };
        catContainer.appendChild(btn);
    });
};

window.renderProducts = function() {
    const container = document.getElementById("products-container");
    container.innerHTML = "";
    if(!menuData[currentLang]) return;

    let items = (currentCategory === "TOP") 
        ? Object.values(menuData[currentLang]).flatMap(c => c.items.filter(i => i.recommended))
        : menuData[currentLang][currentCategory]?.items || [];

    const term = document.getElementById("search-bar").value.toLowerCase();
    if(term) {
        items = Object.values(menuData[currentLang]).flatMap(c => c.items).filter(i => i.name.toLowerCase().includes(term));
    }

    items.forEach((item) => {
        const card = document.createElement("div");
        // CORRECCIÓN: Aseguramos que detecte si hay imagen para el borde verde
        card.className = "product-card" + (item.image && item.image.trim() !== "" ? "" : " no-image");
        
        card.innerHTML = `
            ${item.image && item.image.trim() !== "" ? `
                <div class="card-image-container">
                    ${item.recommended ? '<div class="badge-rec">TOP</div>' : ''}
                    <img src="${item.image}" onload="this.classList.add('loaded')">
                </div>` : ''}
            <div class="card-content">
                ${(!item.image && item.recommended) ? '<div class="badge-rec" style="position:static; display:inline-block; margin-bottom:8px">TOP</div>' : ''}
                <h3>${item.name}</h3>
                <p class="description">${item.description || ''}</p>
                <div class="card-footer"><span class="price">${item.price?.base ? currencyFormatter.format(item.price.base) : ""}</span></div>
            </div>`;
        container.appendChild(card);
    });
};

window.prepareAndPrint = function() {
    const printContainer = document.getElementById("print-menu-container");
    let html = `<div class="print-header"><img src="logo.png"><h1>Siroko Café</h1></div><div class="print-grid">`;
    Object.keys(menuData[currentLang]).forEach(key => {
        html += `<h2 class="print-cat-title">${menuData[currentLang][key].name}</h2>`;
        menuData[currentLang][key].items.forEach(item => {
            html += `<div class="print-item"><span>${item.name}</span><b>${item.price?.base ? currencyFormatter.format(item.price.base) : ""}</b></div>`;
        });
    });
    printContainer.innerHTML = html + `</div>`;
    setTimeout(() => { window.print(); }, 500);
};

// --- SOPORTE PARA CTRL + P ---
window.onbeforeprint = () => {
    if (!document.getElementById("print-menu-container").innerHTML) {
        prepareAndPrint();
    }
};

document.addEventListener("DOMContentLoaded", () => {
    fetch(API_URL).then(res => res.json()).then(data => {
        menuData = data;
        document.getElementById("loading-spinner").style.display = 'none';
        renderCategories();
        renderProducts();
    });

    document.querySelectorAll(".lang-select button").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".lang-select button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentLang = btn.dataset.lang;
            currentCategory = "TOP";
            renderCategories();
            renderProducts();
        };
    });

    document.getElementById("search-bar").oninput = renderProducts;
});
</script>

</body>
</html>
