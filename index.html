<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Siroko Café - Menú</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #8bba8b;
        --dark: #1a1a1a;
        --bg-brand: #F2F1E8; /* El color crema solicitado */
        --white: #ffffff;
        --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-brand);
        color: var(--dark);
    }

    /* HEADER COMPACTO CON LOGO2.PNG */
    header {
        text-align: center;
        padding: 30px 20px 10px;
        background-color: var(--bg-brand);
    }
    header img {
        width: 70px; /* Tamaño del logo optimizado */
        height: auto;
        margin-bottom: 10px;
    }
    header h1 {
        font-family: 'Montserrat', sans-serif;
        font-size: 1.3rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 800;
    }

    .lang-select { display: flex; justify-content: center; gap: 5px; margin-top: 15px; }
    .lang-select button {
        background: rgba(0,0,0,0.05); border: none; padding: 4px 10px; border-radius: 4px;
        font-size: 0.65rem; font-weight: 700; cursor: pointer;
    }
    .lang-select button.active { background: var(--dark); color: var(--white); }

    /* BUSCADOR Y CATEGORÍAS COMPACTOS */
    .hero-section { padding: 10px 1.5rem; }
    #search-bar {
        width: 100%; padding: 10px; background: rgba(0,0,0,0.05); border: none;
        border-radius: 8px; font-size: 0.9rem; outline: none;
    }

    .categories-wrapper {
        position: sticky; top: 0; background: var(--bg-brand);
        z-index: 900; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .categories { display: flex; gap: 6px; overflow-x: auto; padding: 0 1.5rem; scrollbar-width: none; }
    .categories button {
        white-space: nowrap; background: transparent; color: #555; border: 1px solid #ccc;
        padding: 5px 12px; border-radius: 15px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .categories button.active { background: var(--dark); color: #fff; border-color: var(--dark); }

    /* GRID DE PRODUCTOS COMPACTO (2 COLUMNAS EN MÓVIL) */
    #products-container {
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .product-card {
        background: var(--white); border-radius: var(--radius); overflow: hidden;
        border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column;
    }

    .card-image-container { width: 100%; aspect-ratio: 1/1; position: relative; background: #eee; }
    .product-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }
    .product-card img.loaded { opacity: 1; }
    
    .badge-rec {
        position: absolute; top: 5px; left: 5px; background: #000; color: #fff;
        font-size: 0.55rem; padding: 2px 5px; border-radius: 3px; font-weight: 800; z-index: 2;
    }

    .card-content { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card h3 { font-size: 0.85rem; margin-bottom: 4px; color: var(--dark); line-height: 1.2; font-weight: 700; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 0.85rem; font-weight: 800; color: var(--primary); }

    .allergen-icon { width: 14px; height: 14px; fill: #bbb; margin-left: 2px; }

    /* --- ESTILOS DE IMPRESIÓN MEJORADOS --- */
    @media print {
        @page { size: auto; margin: 10mm; }
        body { background-color: #F2F1E8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        header, .lang-select, .hero-section, .categories-wrapper, footer, .print-btn-float, #products-container { display: none !important; }

        #print-menu-container { display: block !important; }
        .print-header { text-align: center; margin-bottom: 20px; }
        .print-header img { width: 60px; margin-bottom: 5px; }
        
        .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 25px; }
        .print-cat-title { 
            grid-column: 1 / -1; font-family: 'Montserrat'; font-size: 14px; 
            text-transform: uppercase; border-bottom: 1.5px solid #000; 
            margin: 15px 0 5px; padding-bottom: 3px; font-weight: 800;
        }
        .print-item { 
            display: flex; justify-content: space-between; align-items: baseline; 
            font-size: 11px; margin-bottom: 4px; border-bottom: 0.5px dotted #ccc;
        }
        .print-price { font-weight: bold; margin-left: 5px; }
    }

    #print-menu-container { display: none; }
    .print-btn-float {
        position: fixed; bottom: 20px; right: 20px; background: var(--dark);
        color: white; border: none; width: 50px; height: 50px; border-radius: 50%;
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 9999;
    }

    footer { padding: 30px 20px; text-align: center; font-size: 0.7rem; color: #999; }
</style>
</head>
<body>

<header>
    <img src="logo2.png" alt="Siroko Café Logo" onerror="this.style.display='none'">
    <h1>Siroko Café</h1>
    <div class="lang-select">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="ca">CA</button>
        <button data-lang="en">EN</button>
    </div>
</header>
    
<div class="hero-section">
    <input type="text" id="search-bar" placeholder="Buscar productos...">
</div>

<div class="categories-wrapper">
    <div class="categories" id="category-buttons"></div>
</div>

<div id="loading-spinner" style="text-align:center; padding:50px; font-size: 0.8rem; color:#999;">Cargando...</div>

<div class="products" id="products-container"></div>

<div id="print-menu-container"></div>

<button class="print-btn-float" onclick="prepareAndPrint()">🖨️</button>
    
<footer>
    <p>SIROKO CAFÉ - Carrer de Girona 94, Barcelona</p>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXOjNXQs-0j0eenVgJcv_jkTuKJ7LTVf1C9XlmX4DaplqD52wAPxjTf36c7adNgPqWvg/exec";
const CATEGORY_ORDER = ["promos", "cafes", "bolleria y dulces", "bebidas calientes", "tostas y bocadillos", "bebidas frias", "bar"];

let menuData = {};
let currentLang = "es";
let currentCategory = "TOP";

const currencyFormatter = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

function normalize(str) {
    return str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
}

function prepareAndPrint() {
    const printContainer = document.getElementById("print-menu-container");
    if (!menuData[currentLang]) return;

    let html = `
        <div class="print-header">
            <img src="logo2.png">
            <h2 style="font-family:Montserrat; text-transform:uppercase; letter-spacing:2px;">Siroko Café</h2>
        </div>
        <div class="print-grid">`;

    Object.keys(menuData[currentLang]).forEach(key => {
        const cat = menuData[currentLang][key];
        html += `<div class="print-cat-title">${cat.name}</div>`;
        cat.items.forEach(item => {
            html += `
                <div class="print-item">
                    <span>${item.name}</span>
                    <span class="print-price">${item.price?.base ? currencyFormatter.format(item.price.base) : ""}</span>
                </div>`;
        });
    });

    html += `</div>`;
    printContainer.innerHTML = html;
    setTimeout(() => { window.print(); }, 500);
}

document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("products-container");
    const catContainer = document.getElementById("category-buttons");
    const searchInput = document.getElementById("search-bar");

    function renderAll() {
        // Categorías
        catContainer.innerHTML = `<button class="${currentCategory === 'TOP' ? 'active' : ''}" onclick="currentCategory='TOP'; window.renderAll();">★ TOP</button>`;
        Object.keys(menuData[currentLang]).forEach(key => {
            catContainer.innerHTML += `<button class="${currentCategory === key ? 'active' : ''}" onclick="currentCategory='${key}'; window.renderAll();">${menuData[currentLang][key].name}</button>`;
        });

        // Productos
        container.innerHTML = "";
        let items = (currentCategory === "TOP") 
            ? Object.values(menuData[currentLang]).flatMap(c => c.items.filter(i => i.recommended))
            : menuData[currentLang][currentCategory]?.items || [];

        const term = searchInput.value.toLowerCase();
        if(term) {
            items = Object.values(menuData[currentLang]).flatMap(c => c.items).filter(i => i.name.toLowerCase().includes(term));
        }

        items.forEach(item => {
            container.innerHTML += `
                <div class="product-card">
                    ${item.image ? `<div class="card-image-container">${item.recommended ? '<div class="badge-rec">TOP</div>' : ''}<img src="${item.image}" onload="this.classList.add('loaded')"></div>` : ''}
                    <div class="card-content">
                        <h3>${item.name}</h3>
                        <div class="card-footer"><span class="price">${item.price?.base ? currencyFormatter.format(item.price.base) : ""}</span></div>
                    </div>
                </div>`;
        });
    }
    window.renderAll = renderAll;

    fetch(API_URL).then(res => res.json()).then(data => {
        menuData = data;
        document.getElementById("loading-spinner").style.display = 'none';
        renderAll();
    });

    document.querySelectorAll(".lang-select button").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".lang-select button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentLang = btn.dataset.lang;
            renderAll();
        };
    });
    searchInput.oninput = renderAll;
});
</script>

</body>
</html>
