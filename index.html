<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Siroko Café - Menú</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

<style>
    /* --- VARIABLES & RESET --- */
    :root {
        --primary: #8bba8b;
        --dark: #333333;
        --bg-brand: #F2F1E8;
        --white: #ffffff;
        --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-brand);
        color: var(--dark);
    }

    /* HEADER HERO (Referencia imagen) */
    .brand-header {
        background-color: var(--bg-brand);
        padding: 40px 20px 20px;
        text-align: center;
    }
    .brand-header img {
        width: 80px; /* Ajusta según el tamaño de tu logo */
        margin-bottom: 15px;
    }
    .brand-header h1 {
        font-family: 'Montserrat', sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 1.5rem;
    }

    /* STICKY NAV */
    header {
        background: var(--bg-brand);
        padding: 10px 1.5rem;
        display: flex;
        justify-content: flex-end;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .lang-select button {
        background: rgba(0,0,0,0.05); border: none; padding: 5px 10px; border-radius: 5px;
        font-size: 0.7rem; font-weight: 700; cursor: pointer; margin-left: 5px;
    }
    .lang-select button.active { background: var(--dark); color: var(--white); }

    .promo-banner {
        background: #e8e7dd;
        color: #5d7a5d;
        text-align: center;
        padding: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        margin: 0 20px 15px;
        border-radius: 5px;
    }

    .hero-section { padding: 0 1.5rem 1rem; }
    #search-bar {
        width: 100%; padding: 10px 15px; background: #e0dfd5; border: none;
        border-radius: 8px; font-size: 0.9rem; outline: none;
    }

    /* CATEGORIES */
    .categories-wrapper { padding-bottom: 10px; }
    .categories { 
        display: flex; gap: 8px; overflow-x: auto; padding: 0 1.5rem; 
        scrollbar-width: none;
    }
    .categories button {
        white-space: nowrap; background: transparent; color: #666; border: 1px solid #ccc;
        padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
        text-transform: uppercase;
    }
    .categories button.active { background: var(--dark); color: #fff; border-color: var(--dark); }

    /* PRODUCTS GRID */
    #products-container {
        padding: 1rem;
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* 2 columnas en móvil */
        gap: 12px;
    }

    .product-card {
        background: var(--white); border-radius: var(--radius); overflow: hidden;
        display: flex; flex-direction: column;
        border: 1px solid rgba(0,0,0,0.03);
    }

    .card-image-container {
        width: 100%; aspect-ratio: 1/1; position: relative; background: #eee;
    }
    .product-card img {
        width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s;
    }
    .product-card img.loaded { opacity: 1; }
    
    .badge-rec {
        position: absolute; top: 5px; left: 5px; background: #000; color: #fff;
        font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 800;
    }

    .card-content { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card h3 { font-size: 0.9rem; margin-bottom: 8px; color: var(--dark); line-height: 1.2; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .product-card .price { font-size: 0.9rem; font-weight: 700; color: var(--primary); }

    .allergen-icon { width: 14px; height: 14px; fill: #ccc; margin-left: 3px; }

    /* PRINT / PDF ADJUSTMENTS */
    @media print {
        body { background: white !important; }
        header, .lang-select, .promo-banner, .hero-section, .categories-wrapper, footer, .print-btn-float { display: none !important; }
        #print-menu-container { display: block !important; padding: 0; }
        #products-container { display: none !important; }
        
        .print-header { text-align: center; margin-bottom: 30px; }
        .print-header img { width: 60px; }
        
        .print-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .print-category-title {
            grid-column: 1 / -1;
            border-bottom: 1px solid #000;
            margin: 20px 0 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .print-item {
            display: flex; justify-content: space-between; font-size: 12px;
            border-bottom: 1px dotted #ccc; padding-bottom: 2px;
        }
        .print-price { font-weight: bold; }
    }

    .print-btn-float {
        position: fixed; bottom: 20px; right: 20px; background: var(--dark);
        color: white; border: none; width: 60px; height: 60px; border-radius: 50%;
        font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999;
    }

    footer { padding: 40px 20px; text-align: center; font-size: 0.7rem; color: #999; }

    @media (min-width: 900px) {
        #products-container { grid-template-columns: repeat(4, 1fr); max-width: 1000px; margin: 0 auto; }
    }
</style>
</head>
<body>

<header>
    <div class="lang-select">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="ca">CA</button>
        <button data-lang="en">EN</button>
    </div>
</header>

<div class="brand-header">
    <img src="logo2.png" alt="Siroko Café Logo">
    <h1>Siroko Café</h1>
</div>

<div id="promo-banner" class="promo-banner">
     <span id="promo-text">10% adicional si se consume en terraza</span>
</div>
    
<div class="hero-section">
    <input type="text" id="search-bar" placeholder="Buscar productos...">
</div>

<div class="categories-wrapper">
    <div class="categories" id="category-buttons"></div>
</div>

<div id="loading-spinner" style="text-align: center; padding: 40px; color: #999;">Cargando...</div>

<div class="products" id="products-container"></div>

<div id="print-menu-container"></div>

<button class="print-btn-float" onclick="prepareAndPrint()">🖨️</button>
    
<footer>
    <p>SIROKO CAFÉ</p>
    <p>Carrer de Girona 94, Barcelona</p>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXOjNXQs-0j0eenVgJcv_jkTuKJ7LTVf1C9XlmX4DaplqD52wAPxjTf36c7adNgPqWvg/exec";
const CATEGORY_ORDER = ["promos", "cafes", "bolleria y dulces", "bebidas calientes", "tostas y bocadillos", "bebidas frias", "bar"];

let menuData = {};
let currentLang = "es";
let currentCategory = "TOP";

const ICONS = {
    "gluten": '<svg class="allergen-icon" viewBox="0 0 24 24"><path d="M10,2C10,2 10,12 11,12C11.5,12 12,11.5 12,11C12,11 12,2 12,2C12,2 13,11 13,11C13,11.5 13.5,12 14,12C15,12 15,2 15,2H16C16,2 15,13 13,15C13,17 14,20 14,22H11C11,20 12,17 12,15C10,13 9,2 9,2H10Z"/></svg>',
    "lactosa": '<svg class="allergen-icon" viewBox="0 0 24 24"><path d="M17,4V2H7V4H2V6H4V18A2,2 0 0,0 6,20H18A2,2 0 0,0 20,18V6H22V4H17M18,18H6V6H18V18M13.5,12A1.5,1.5 0 0,1 12,13.5A1.5,1.5 0 0,1 10.5,12A1.5,1.5 0 0,1 12,10.5A1.5,1.5 0 0,1 13.5,12Z"/></svg>'
};

const currencyFormatter = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

function normalize(str) {
    return str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
}

window.handleImageError = function(cardId) {
    const imgCont = document.getElementById(`img-cont-${cardId}`);
    if (imgCont) imgCont.style.display = 'none';
};

function prepareAndPrint() {
    const printContainer = document.getElementById("print-menu-container");
    printContainer.innerHTML = `
        <div class="print-header">
            <img src="logo2.png">
            <h2>SIROKO CAFÉ</h2>
        </div>
        <div class="print-grid" id="print-grid-items"></div>
    `;
    const grid = document.getElementById("print-grid-items");

    Object.keys(menuData[currentLang]).forEach(catKey => {
        const cat = menuData[currentLang][catKey];
        grid.innerHTML += `<h3 class="print-category-title">${cat.name}</h3>`;
        cat.items.forEach(item => {
            grid.innerHTML += `
                <div class="print-item">
                    <span>${item.name}</span>
                    <span class="print-price">${item.price?.base ? currencyFormatter.format(item.price.base) : ""}</span>
                </div>`;
        });
    });
    setTimeout(() => { window.print(); }, 500);
}

document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("products-container");
    const catContainer = document.getElementById("category-buttons");
    const searchInput = document.getElementById("search-bar");

    function renderCategories() {
        catContainer.innerHTML = `<button class="${currentCategory === 'TOP' ? 'active' : ''}" onclick="currentCategory='TOP'; renderAll();">★ TOP</button>`;
        Object.keys(menuData[currentLang]).forEach(key => {
            catContainer.innerHTML += `<button class="${currentCategory === key ? 'active' : ''}" onclick="currentCategory='${key}'; renderAll();">${menuData[currentLang][key].name}</button>`;
        });
    }

    function renderProducts() {
        container.innerHTML = "";
        let items = [];
        if(currentCategory === "TOP") {
            Object.values(menuData[currentLang]).forEach(c => items = items.concat(c.items.filter(i => i.recommended)));
        } else {
            items = menuData[currentLang][currentCategory]?.items || [];
        }

        const term = searchInput.value.toLowerCase();
        if(term) {
            let all = [];
            Object.values(menuData[currentLang]).forEach(c => all = all.concat(c.items));
            items = all.filter(i => i.name.toLowerCase().includes(term));
        }

        items.forEach((item, index) => {
            const cardId = `c-${index}`;
            const imgUrl = item.image?.trim();
            container.innerHTML += `
                <div class="product-card">
                    ${imgUrl ? `
                    <div class="card-image-container" id="img-cont-${cardId}">
                        ${item.recommended ? '<div class="badge-rec">TOP</div>' : ''}
                        <img src="${imgUrl}" onload="this.classList.add('loaded')" onerror="handleImageError('${cardId}')">
                    </div>` : ''}
                    <div class="card-content">
                        <h3>${item.name}</h3>
                        <div class="card-footer">
                            <span class="price">${item.price?.base ? currencyFormatter.format(item.price.base) : ""}</span>
                            <div class="allergens">${(item.allergens || []).map(a => ICONS[normalize(a)] || '').join('')}</div>
                        </div>
                    </div>
                </div>`;
        });
    }

    window.renderAll = () => { renderCategories(); renderProducts(); };

    fetch(API_URL).then(res => res.json()).then(data => {
        menuData = data;
        document.getElementById("loading-spinner").style.display = 'none';
        renderAll();
    });

    document.querySelectorAll(".lang-select button").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".lang-select button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentLang = btn.dataset.lang;
            renderAll();
        };
    });
    searchInput.oninput = renderProducts;
});
</script>

</body>
</html>
