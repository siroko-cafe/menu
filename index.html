<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Siroko Café - Menú</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #8bba8b;
        --dark: #1a1a1a;
        --light: #f4f4f4;
        --white: #ffffff;
        --shadow: 0 4px 15px rgba(0,0,0,0.05);
        --radius: 12px;
        --bg-print: #F2F1E8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: var(--light); color: var(--dark); }
    h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

    /* HEADER */
    header {
        background: var(--white); padding: 0.8rem 1.5rem;
        display: flex; justify-content: space-between; align-items: center;
        position: sticky; top: 0; z-index: 1000; box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    }
    .logo-wrapper { display: flex; align-items: center; gap: 10px; }
    .logo-wrapper img { height: 40px; }
    .logo-wrapper h1 { font-size: 1.2rem; text-transform: uppercase; font-weight: 800; }
    h1 a { text-decoration: none; color: inherit; }

    .lang-select button {
        background: #eee; border: none; padding: 6px 10px; border-radius: 6px;
        font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    .lang-select button.active { background: var(--dark); color: var(--white); }

    /* HERO & SEARCH */
    .hero-section { padding: 1.5rem 1.5rem 0.5rem; background: var(--white); }
    #search-bar {
        width: 100%; padding: 12px 15px; background: #f0f0f0; border: none;
        border-radius: 10px; font-size: 1rem; outline: none;
    }

    /* CATEGORIES - SCROLL FLUIDO */
    .categories-wrapper {
        position: sticky; top: 60px; background: rgba(255,255,255,0.95);
        backdrop-filter: blur(5px); z-index: 900; padding: 10px 0; border-bottom: 1px solid #eee;
    }
    .categories { 
        display: flex; gap: 8px; overflow-x: auto; padding: 0 1.5rem; 
        scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .categories button {
        white-space: nowrap; background: transparent; color: #666; border: 1px solid #ddd;
        padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .categories button.active { background: var(--dark); color: #fff; border-color: var(--dark); }

    /* PRODUCT CARDS CON BORDE VERDE */
    #products-container {
        padding: 1.5rem; display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;
    }
    .product-card {
        background: var(--white); border-radius: var(--radius); overflow: hidden;
        box-shadow: var(--shadow); border: 1px solid #eee; display: flex; flex-direction: column;
    }
    /* Restaurado: Borde verde si no hay imagen */
    .product-card.no-image { border-top: 5px solid var(--primary) !important; }

    .card-image-container { width: 100%; aspect-ratio: 4/3; position: relative; background: #f0f0f0; }
    .product-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
    .product-card img.loaded { opacity: 1; }
    
    .card-content { padding: 14px; flex-grow: 1; }
    .product-card h3 { font-size: 1.1rem; margin-bottom: 5px; }
    .price { font-size: 1.1rem; font-weight: 800; color: var(--primary); }

    /* ESTILOS IMPRESIÓN */
    @media print {
        header, .hero-section, .categories-wrapper, footer, .print-btn-float, #products-container, #loading-spinner {
            display: none !important;
        }
        body { background-color: var(--bg-print) !important; }
        #print-menu-container { display: block !important; padding: 20mm; }
        .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; }
        .print-cat-title { grid-column: 1 / -1; border-bottom: 2px solid #000; margin-top: 20px; text-transform: uppercase; }
        .print-item { display: flex; justify-content: space-between; border-bottom: 1px dotted #aaa; padding: 5px 0; }
    }
    #print-menu-container { display: none; }
    .print-btn-float {
        position: fixed; bottom: 20px; right: 20px; background: var(--dark);
        color: white; border: none; width: 50px; height: 50px; border-radius: 50%;
        cursor: pointer; z-index: 9999; font-size: 20px;
    }
</style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <img src="logo.png" alt="Logo">
        <h1><a href="#">Siroko Café</a></h1>
    </div>
    <div class="lang-select">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="ca">CA</button>
        <button data-lang="en">EN</button>
    </div>
</header>

<div class="hero-section"><input type="text" id="search-bar" placeholder="Buscar..."></div>
<div class="categories-wrapper"><div class="categories" id="category-buttons"></div></div>
<div id="loading-spinner" style="text-align:center; padding:50px;">Cargando...</div>
<div id="products-container"></div>
<div id="print-menu-container"></div>
<button class="print-btn-float" onclick="prepareAndPrint()">🖨️</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXOjNXQs-0j0eenVgJcv_jkTuKJ7LTVf1C9XlmX4DaplqD52wAPxjTf36c7adNgPqWvg/exec";
let menuData = {};
let currentLang = "es";
let currentCategory = "TOP";
const formatter = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

// --- LÓGICA DE CATEGORÍAS Y SCROLL ---
window.handleCategoryChange = function(btnElement, categoryKey) {
    currentCategory = categoryKey;
    renderCategories();
    renderProducts();

    // Centrado del botón
    if (btnElement) {
        setTimeout(() => {
            btnElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 50);
    }

    // Reset Scroll Vertical
    setTimeout(() => {
        const search = document.getElementById("search-bar");
        window.scrollTo({ top: search.offsetTop - 80, behavior: 'smooth' });
    }, 100);
};

window.renderCategories = function() {
    const container = document.getElementById("category-buttons");
    container.innerHTML = "";
    
    // Botón TOP
    const btnTop = document.createElement("button");
    btnTop.textContent = "★ TOP";
    btnTop.className = currentCategory === "TOP" ? "active" : "";
    btnTop.onclick = function() { window.handleCategoryChange(this, "TOP"); };
    container.appendChild(btnTop);

    if (!menuData[currentLang]) return;
    Object.keys(menuData[currentLang]).forEach(key => {
        const btn = document.createElement("button");
        btn.textContent = menuData[currentLang][key].name;
        if(currentCategory === key) btn.className = "active";
        btn.onclick = function() { window.handleCategoryChange(this, key); };
        container.appendChild(btn);
    });
};

window.renderProducts = function() {
    const container = document.getElementById("products-container");
    container.innerHTML = "";
    let items = (currentCategory === "TOP") 
        ? Object.values(menuData[currentLang]).flatMap(c => c.items.filter(i => i.recommended))
        : menuData[currentLang][currentCategory]?.items || [];

    const term = document.getElementById("search-bar").value.toLowerCase();
    if(term) items = Object.values(menuData[currentLang]).flatMap(c => c.items).filter(i => i.name.toLowerCase().includes(term));

    items.forEach(item => {
        const card = document.createElement("div");
        // Lógica de clase no-image corregida
        card.className = "product-card" + (item.image ? "" : " no-image");
        card.innerHTML = `
            ${item.image ? `<div class="card-image-container"><img src="${item.image}" onload="this.classList.add('loaded')"></div>` : ''}
            <div class="card-content">
                <h3>${item.name}</h3>
                <p style="color:#666; font-size:0.9rem; margin-bottom:10px">${item.description || ''}</p>
                <div class="price">${item.price?.base ? formatter.format(item.price.base) : ""}</div>
            </div>`;
        container.appendChild(card);
    });
};

window.prepareAndPrint = function() {
    const printBox = document.getElementById("print-menu-container");
    let html = `<div style="text-align:center"><img src="logo.png" style="width:80px"><h1>Siroko Café</h1></div><div class="print-grid">`;
    Object.keys(menuData[currentLang]).forEach(key => {
        html += `<h2 class="print-cat-title">${menuData[currentLang][key].name}</h2>`;
        menuData[currentLang][key].items.forEach(i => {
            html += `<div class="print-item"><span>${i.name}</span><b>${i.price?.base ? formatter.format(i.price.base) : ""}</b></div>`;
        });
    });
    printBox.innerHTML = html + `</div>`;
    setTimeout(() => { window.print(); }, 300);
};

// Capturar Ctrl+P para que no salga vacío
window.onbeforeprint = () => {
    if(!document.getElementById("print-menu-container").innerHTML) prepareAndPrint();
};

document.addEventListener("DOMContentLoaded", () => {
    fetch(API_URL).then(r => r.json()).then(data => {
        menuData = data;
        document.getElementById("loading-spinner").style.display = 'none';
        renderCategories();
        renderProducts();
    });
    document.getElementById("search-bar").oninput = renderProducts;
});
</script>
</body>
</html>
