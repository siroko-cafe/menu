<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Siroko Café - Menú Digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* --- VARIABLES & RESET --- */
:root {
    --primary: #8bba8b;        /* Verde Siroko */
    --primary-dark: #6da06d;
    --dark: #1a1a1a;           
    --light: #f4f4f4;          
    --white: #ffffff;
    --gray: #666;
    --shadow: 0 4px 20px rgba(0,0,0,0.05);
    --radius: 16px;            
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body { 
    font-family: 'Inter', sans-serif;
    background-color: var(--light); 
    color: var(--dark); 
    padding-bottom: 80px; 
    letter-spacing: -0.01em;
}

h1, h2, h3, h4 { 
    font-family: 'Montserrat', sans-serif; 
    font-weight: 700;
}

/* --- HEADER --- */
header { 
    background: var(--white); 
    padding: 0.8rem 1.5rem; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px; 
}

/* LOGO: Asegúrate de que logo.png esté en la carpeta */
.logo-wrapper img { 
    height: 42px; 
    width: auto;
    object-fit: contain; 
}

.logo-wrapper h1 {
    font-size: 1.2rem; 
    color: var(--dark);
    margin: 0;
    font-weight: 800;
    line-height: 1;
    text-transform: uppercase;
}

.lang-select { display: flex; gap: 4px; }
.lang-select button { 
    background: #f0f0f0; 
    border: none; 
    padding: 8px 12px; 
    border-radius: 8px; 
    font-size: 0.7rem; 
    font-weight: 700; 
    cursor: pointer; 
    transition: all 0.2s ease;
    font-family: 'Inter', sans-serif;
}
.lang-select button.active { 
    background: var(--dark); 
    color: var(--white); 
}

/* --- SEARCH --- */
.hero-section {
    padding: 1.5rem 1.5rem 0.5rem 1.5rem;
    background: var(--white);
}

#search-bar { 
    width: 100%; 
    padding: 14px 20px; 
    background: #f0f0f0;
    border: none; 
    border-radius: 12px; 
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
}
#search-bar:focus { 
    background: #fff;
    box-shadow: 0 0 0 2px var(--primary); 
}

/* --- CATEGORIES --- */
.categories-wrapper {
    position: sticky;
    top: 65px; 
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    z-index: 900;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.categories { 
    display: flex; 
    gap: 8px; 
    overflow-x: auto; 
    padding: 0 1.5rem;
    scrollbar-width: none; 
    -ms-overflow-style: none; 
}
.categories::-webkit-scrollbar { display: none; }

.categories button { 
    white-space: nowrap;
    background: transparent; 
    color: var(--gray); 
    border: 1px solid #e0e0e0; 
    padding: 8px 16px; 
    border-radius: 50px; 
    font-size: 0.85rem; 
    cursor: pointer; 
    transition: all 0.2s;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
}
.categories button.active { 
    background: var(--dark); 
    color: var(--white); 
    border-color: var(--dark);
}
